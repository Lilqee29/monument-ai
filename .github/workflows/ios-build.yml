name: Build Unsigned IPA (Relica)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest available Xcode
        run: |
          echo "=== All Xcode versions on runner ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo ""
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version
          echo ""
          echo "=== Verifying Swift tools version ==="
          swift -version | head -1

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Patch expo-modules-jsi for Swift 6.2 compatibility
        run: |
          # ── Fix 1: Downgrade SPM tools version to avoid Swift 6 strict mode entirely ──
          PKG="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$PKG" ]; then
            echo "=== Original Package.swift first line ==="
            head -1 "$PKG"
            echo ""
            # The file uses "// swift-tools-version: 6.2" (with // prefix and space)
            perl -pi -e 's/swift-tools-version:\s*6\.\d+/swift-tools-version: 5.9/' "$PKG"
            echo "=== Patched Package.swift first line ==="
            head -1 "$PKG"
            echo ""
          fi

          # ── Fix 2: Replace the guard line to avoid abs() entirely in Swift 6.2 ──
          FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Coding/JavaScriptCodable+Date.swift"
          if [ -f "$FILE" ]; then
            echo "=== Full context around line 53 ==="
            sed -n '50,56p' "$FILE"
            echo ""
            # Avoid abs() entirely — Swift 6.2 can't resolve the overload
            # Original: guard milliseconds.isFinite, abs(milliseconds) <= maxJavaScriptDateMilliseconds else {
            # New: check range directly without abs()
            perl -pi -e "s{guard milliseconds\\.isFinite, abs\\(milliseconds\\) <= maxJavaScriptDateMilliseconds else \\{}{guard milliseconds.isFinite, milliseconds >= -maxJavaScriptDateMilliseconds, milliseconds <= maxJavaScriptDateMilliseconds else {}" "$FILE"
            echo "=== Patched context around line 53 ==="
            sed -n '50,56p' "$FILE"
            echo ""
            echo "All patches applied."
          else
            echo "File not found, skipping patch."
          fi

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile to force Swift 5 language mode
        run: |
          PODFILE="ios/Podfile"
          if [ -f "$PODFILE" ]; then
            echo "=== Post-install block ==="
            awk '/post_install do/,/^end/' "$PODFILE"
            echo ""
            # Append SWIFT_VERSION inside the EXISTING post_install's inner loop
            # Find the last config.build_settings line before the 'end' in post_install and add after it
            ruby -e '
              lines = File.readlines("'"$PODFILE"'")
              in_post = false
              insert_idx = nil
              lines.each_with_index do |line, i|
                in_post = true if line =~ /post_install\s+do/
                if in_post && line =~ /config\.build_settings/
                  insert_idx = i
                end
                if in_post && line.strip == "end"
                  break
                end
              end
              if insert_idx
                indent = lines[insert_idx][/^(\s*)/, 1] || "        "
                lines.insert(insert_idx + 1, "#{indent}config.build_settings[\"SWIFT_VERSION\"] = \"5\"\n")
                File.write("'"$PODFILE"'", lines.join)
                puts "Injected SWIFT_VERSION=5 after line #{insert_idx+1}"
              else
                puts "Could not find insertion point in post_install"
              end
            '
            echo "=== Verifying ==="
            grep -n "SWIFT_VERSION" "$PODFILE" || echo "WARNING: not found"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/RELICA.xcworkspace \
            -scheme RELICA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Relica.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS="-swift-version 5"

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Relica.xcarchive/Products/Applications/*.app Payload/
          zip -r Relica.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relica-unsigned-ipa
          path: Relica.ipa
          retention-days: 14