name: Build Unsigned IPA (Relica)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest available Xcode
        run: |
          echo "=== All Xcode versions on runner ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo ""
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version
          echo ""
          echo "=== Verifying Swift tools version ==="
          swift -version | head -1

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Patch expo-modules-jsi for Swift 6.2 compatibility
        run: |
          # ── Fix 1: Downgrade SPM tools version to avoid Swift 6 strict mode entirely ──
          PKG="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$PKG" ]; then
            echo "=== Original Package.swift first line ==="
            head -1 "$PKG"
            echo ""
            # Downgrade swift-tools-version:6.0 → swift-tools-version:5.9
            # This disables Swift 6 strict concurrency and avoids abs() type inference issues
            sed -i.bak 's/swift-tools-version:6\./swift-tools-version:5./g' "$PKG"
            echo "=== Patched Package.swift first line ==="
            head -1 "$PKG"
            echo ""
          fi

          # ── Fix 2: Also fix the abs() call directly in case SPM downgrade isn't enough ──
          FILE="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Coding/JavaScriptCodable+Date.swift"
          if [ -f "$FILE" ]; then
            echo "=== Original line 53 ==="
            sed -n '53p' "$FILE"
            echo ""
            echo "Patching $FILE for Swift 6.2 type inference..."
            # Cast the argument INSIDE abs() to resolve type ambiguity in Swift 6.2
            # WRONG: (abs(milliseconds) as Double) — casts result, abs() itself is still ambiguous
            # RIGHT: abs(milliseconds as Double) — tells Swift which abs() overload to use
            sed -i.bak 's/abs(milliseconds)/abs(milliseconds as Double)/' "$FILE"
            echo ""
            echo "=== Patched line 53 ==="
            sed -n '53p' "$FILE"
            echo ""
            echo "All patches applied."
          else
            echo "File not found, skipping patch."
          fi

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile to force Swift 5 language mode
        run: |
          PODFILE="ios/Podfile"
          if [ -f "$PODFILE" ]; then
            # Add post_install hook to force Swift 5 for all pods if not already present
            if ! grep -q 'swift_version.*5' "$PODFILE" 2>/dev/null; then
              cat >> "$PODFILE" << 'HOOK'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['SWIFT_VERSION'] = '5'
              end
            end
          end
          HOOK
              echo "Added Swift 5 post_install hook to Podfile"
            else
              echo "Swift 5 setting already in Podfile"
            fi
          else
            echo "Podfile not found, skipping."
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/RELICA.xcworkspace \
            -scheme RELICA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Relica.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS="-swift-version 5"

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Relica.xcarchive/Products/Applications/*.app Payload/
          zip -r Relica.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relica-unsigned-ipa
          path: Relica.ipa
          retention-days: 14