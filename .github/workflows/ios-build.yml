name: Build Unsigned IPA (Relica)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest available Xcode
        run: |
          echo "=== All Xcode versions on runner ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo ""
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version
          echo ""
          echo "=== Verifying Swift tools version ==="
          swift -version | head -1

      - name: Install JS deps
        run: npm install --legacy-peer-deps

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/RELICA.xcworkspace \
            -scheme RELICA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Relica.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Relica.xcarchive/Products/Applications/*.app Payload/
          zip -r Relica.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relica-unsigned-ipa
          path: Relica.ipa
          retention-days: 14